<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Live Test Runner</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- As fontes são o único recurso externo, e degradam para a pilha do
         sistema se não carregarem. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;700&display=swap"
    />
    <!--
      Esta página fica em `public/` e vai para o build sem passar pelo Vite:
      o CSS é embutido de propósito, porque um 404 que depende de um arquivo
      que pode não existir é um 404 que quebra duas vezes.

      Pela mesma razão os dois idiomas e os dois temas estão aqui dentro, em vez
      de virem do bundle: esta é a única página do site que precisa funcionar
      mesmo quando o resto não carregou.
    -->
    <style>
      :root,
      :root[data-theme="dark"] {
        --tinta: #e8ecf6;
        --tinta-fraca: #8a93ab;
        --ciano: #22d3ee;
        --violeta: #a78bfa;
        --fundo: #07090f;
        --caixa: rgba(13, 17, 28, 0.7);
        --linha: rgba(148, 163, 184, 0.18);
        --aurora-a: rgba(34, 211, 238, 0.16);
        --aurora-b: rgba(167, 139, 250, 0.14);
      }

      :root[data-theme="light"] {
        --tinta: #161b26;
        --tinta-fraca: #5a6478;
        --ciano: #0b7f96;
        --violeta: #6d3bd6;
        --fundo: #ffffff;
        --caixa: #f3f5f9;
        --linha: #e2e6ef;
        --aurora-a: rgba(11, 127, 150, 0.08);
        --aurora-b: rgba(109, 59, 214, 0.07);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--fundo);
        color: var(--tinta);
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* As mesmas auroras da home, para o erro não parecer outro site. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(560px circle at 18% 12%, var(--aurora-a), transparent 60%),
          radial-gradient(620px circle at 82% 88%, var(--aurora-b), transparent 60%);
      }

      main {
        position: relative;
        max-width: 560px;
        text-align: center;
      }

      .marca {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 40px;
        text-decoration: none;
        color: var(--tinta-fraca);
        font-family: "JetBrains Mono", Consolas, ui-monospace, monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .marca svg {
        width: 34px;
        height: 34px;
      }

      .codigo {
        font-family: "JetBrains Mono", Consolas, ui-monospace, monospace;
        font-size: clamp(64px, 14vw, 104px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(100deg, var(--ciano), var(--violeta));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      h1 {
        margin: 20px 0 0;
        font-size: clamp(22px, 4vw, 28px);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p {
        margin: 14px 0 0;
        color: var(--tinta-fraca);
        line-height: 1.6;
      }

      .terminal {
        margin: 32px 0 0;
        padding: 14px 18px;
        border: 1px solid var(--linha);
        border-radius: 12px;
        background: var(--caixa);
        font-family: "JetBrains Mono", Consolas, ui-monospace, monospace;
        font-size: 14px;
        color: var(--tinta-fraca);
        text-align: left;
        overflow-x: auto;
        white-space: nowrap;
      }

      .terminal b {
        color: var(--ciano);
        font-weight: 500;
      }

      .acoes {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      .acoes a {
        display: inline-block;
        padding: 13px 26px;
        border-radius: 10px;
        border: 1px solid var(--linha);
        color: var(--tinta);
        font-family: "JetBrains Mono", Consolas, ui-monospace, monospace;
        font-size: 14px;
        text-decoration: none;
        transition:
          border-color 0.2s ease,
          transform 0.2s ease;
      }

      .acoes a:first-child {
        border-color: color-mix(in srgb, var(--ciano) 45%, transparent);
        background: color-mix(in srgb, var(--ciano) 10%, transparent);
      }

      .acoes a:hover,
      .acoes a:focus-visible {
        border-color: var(--ciano);
        transform: translateY(-1px);
      }

      .acoes a:focus-visible {
        outline: 2px solid var(--ciano);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .acoes a {
          transition: none;
        }
        .acoes a:hover {
          transform: none;
        }
      }
    </style>

    <script>
      // O tema e o idioma são os mesmos que o resto do site guardou. As duas
      // leituras são protegidas: em navegação privada o `localStorage` lança, e
      // um 404 que quebra ao explicar que algo quebrou não ajuda ninguém.
      (function () {
        try {
          var t = localStorage.getItem('livetest:theme');
          if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'dark';
          var escuro =
            t === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : t === 'dark';
          document.documentElement.dataset.theme = escuro ? 'dark' : 'light';
        } catch (x) {}
      })();
    </script>
  </head>

  <body>
    <main>
      <a class="marca" href="/">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#22d3ee" />
              <stop offset="100%" stop-color="#a78bfa" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="8" fill="#0a0d16" />
          <g fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round">
            <path d="M7 9h8M11 9v14" />
            <circle cx="22" cy="11" r="3.4" />
            <path d="M22 14.4v4.2M17.5 23h9" />
          </g>
        </svg>
        Live Test Runner
      </a>

      <div class="codigo">404</div>
      <h1 data-en="No file at this path" data-pt="Nenhum arquivo neste caminho">
        No file at this path
      </h1>
      <p
        data-en="The dependency graph does not know this route. It is probably an old link, or one letter too many in the address."
        data-pt="O grafo de dependências não conhece esta rota. Deve ser um link antigo, ou uma letra a mais no endereço."
      >
        The dependency graph does not know this route. It is probably an old link, or one letter
        too many in the address.
      </p>

      <div class="terminal"><b>livetest</b> resolve · 0 files, 0 tests</div>

      <div class="acoes">
        <a href="/" data-en="← home" data-pt="← início">← home</a>
        <a
          href="/guide/introduction/"
          data-en="documentation"
          data-pt="documentação"
          data-href-pt="/pt/guide/introduction/"
          >documentation</a
        >
      </div>
    </main>

    <script>
      // Um 404 pode ser a primeira página que alguém vê, então a escolha de
      // idioma segue a mesma regra do resto do site: a preferência guardada, o
      // idioma do navegador, e inglês quando nenhum dos dois serve.
      (function () {
        var idioma = 'en';
        try {
          var guardado = localStorage.getItem('livetest:locale');
          if (guardado === 'pt' || guardado === 'en') {
            idioma = guardado;
          } else {
            var lista = navigator.languages || [navigator.language || ''];
            for (var i = 0; i < lista.length; i++) {
              var p = (lista[i] || '').toLowerCase().split('-')[0];
              if (p === 'pt' || p === 'en') {
                idioma = p;
                break;
              }
            }
          }
        } catch (x) {}

        if (idioma !== 'pt') return;

        document.documentElement.lang = 'pt-BR';
        document.title = 'Página não encontrada · Live Test Runner';
        document.querySelector('.terminal').innerHTML =
          '<b>livetest</b> resolve · 0 arquivos, 0 testes';

        var alvos = document.querySelectorAll('[data-pt]');
        for (var n = 0; n < alvos.length; n++) {
          alvos[n].textContent = alvos[n].dataset.pt;
          if (alvos[n].dataset.hrefPt) alvos[n].setAttribute('href', alvos[n].dataset.hrefPt);
        }
      })();
    </script>
  </body>
</html>
